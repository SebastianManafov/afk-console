<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RCC Live POV</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="crosshair">+</div>
  <button id="poseToggle" type="button" aria-pressed="false" title="Toggle the client-only crawl/swim view (C)"><span id="poseToggleLabel">Crawl view: Off</span><kbd>C</kbd></button>
  <div id="chatOverlay" aria-live="polite"></div>
  <div id="minecraftHud">
    <div id="offhandItem" class="held-card" hidden><span id="offhandIcon" class="standalone-icon" aria-label="Offhand item"></span></div>
    <div id="survivalHud">
      <div class="meter-row"><span id="armorMeter"></span><span id="heartMeter"></span><span id="foodMeter"></span></div>
      <div class="xp-row"><span id="xpLevel">0</span></div>
      <div id="mcHotbar" class="slot-grid hotbar-grid" aria-label="Hotbar"></div>
    </div>
  </div>
  <section id="inventoryPanel" class="minecraft-window" hidden aria-label="Inventory">
    <div class="inventory-window">
      <div class="inventory-window-header"><h2>Crafting</h2><button id="closeInventory" type="button" aria-label="Close inventory">×</button></div>
      <div class="inventory-top">
        <div class="player-loadout">
          <div id="armorSlots" class="armor-slots" aria-label="Armor">
            <div class="inventory-slot armor-slot" data-armor="head" aria-label="Helmet"></div>
            <div class="inventory-slot armor-slot" data-armor="chest" aria-label="Chestplate"></div>
            <div class="inventory-slot armor-slot" data-armor="legs" aria-label="Leggings"></div>
            <div class="inventory-slot armor-slot" data-armor="feet" aria-label="Boots"></div>
          </div>
          <div id="playerPreview" class="player-preview" aria-label="Player preview">
            <div class="avatar-head"></div><div class="avatar-body"></div><div class="avatar-arm avatar-arm-left"></div><div class="avatar-arm avatar-arm-right"></div><div class="avatar-leg avatar-leg-left"></div><div class="avatar-leg avatar-leg-right"></div>
          </div>
        </div>
        <div class="crafting-panel">
          <h3>Crafting</h3>
          <div class="crafting-row"><div id="craftingGrid" class="slot-grid crafting-grid" aria-label="Crafting grid"></div><span class="crafting-arrow" aria-hidden="true">→</span><div id="craftingOutput" class="inventory-slot crafting-output" aria-label="Crafting output"></div></div>
        </div>
      </div>
      <div class="inventory-divider"></div>
      <div id="inventoryMainSlots" class="slot-grid inventory-grid" aria-label="Inventory"></div>
      <div id="inventoryHotbar" class="slot-grid hotbar-grid inventory-hotbar" aria-label="Inventory hotbar"></div>
      <p class="inventory-note">Live read-only inventory · Press E or Escape to close</p>
    </div>
  </section>
  <section id="serverWindowPanel" class="minecraft-server-window" hidden aria-label="Minecraft server window">
    <div id="serverWindowSurface" class="minecraft-server-surface">
      <div id="serverWindowTitle" class="minecraft-server-title"></div>
      <div id="serverWindowInventoryTitle" class="minecraft-server-inventory-title">Inventory</div>
      <div id="serverWindowSlots" class="minecraft-server-slots"></div>
    </div>
  </section>
  <div id="playerList" class="panel" hidden><strong>Players online</strong><div id="players"></div></div>
  <canvas id="minimap" width="180" height="180" hidden></canvas>
  <script src="index.js"></script>
</body>
</html>
